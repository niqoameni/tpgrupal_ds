spring.application.name=desarrollosoftware

# Conexión a Base de Datos MySQL (con creación automática si no existe)
spring.datasource.url=jdbc:mysql://[::1]:3306/facturacion_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración Hibernate / JPA
# Con 'update', Hibernate genera o actualiza las tablas automáticamente al iniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Configuración ARCA / AFIP Homologación (Testing) - Credenciales incluidas en el repositorio
afip.enabled=true
afip.cuit=20446629698
afip.key-path=classpath:afip/privada_test.key
afip.cert-path=classpath:afip/certificado_test.crt
afip.punto-venta=1
afip.cbte-tipo=11

# Logging
logging.level.com.utn.frm.desarrollosoftware=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
